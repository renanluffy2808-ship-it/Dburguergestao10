name: Extrair Projeto D Burger

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado na raiz."
            exit 1
          fi

          mkdir -p /tmp/dburger
          unzip -oq "$ZIP" -d /tmp/dburger

          ROOT=$(find /tmp/dburger -type f -name package.json \
            -exec sh -c '
              for f do
                d="${f%/*}"
                if [ -f "$d/render.yaml" ]; then
                  echo "$d"
                  exit 0
                fi
              done
            ' sh {} + | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERRO: package.json e render.yaml nao encontrados juntos."
            exit 1
          fi

          rsync -a --exclude='.git/' "$ROOT"/ ./
          test -f package.json
          test -f render.yaml
          echo "Extracao concluida."

      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extrai projeto D Burger"
          git push
          
